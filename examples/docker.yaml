title: What a container actually is
takeaway: A container is a process with a restricted view of one machine — not a small computer of its own.

roles:
  package: green
  good: green
  problem: red
  system: blue
  inert: grey

symbols:
  whale: container

scenes:
  # The scene the house style is set by: a labelled container on the left, a
  # column of icon-and-line properties down the middle, the verdict on the right.
  - n: 1
    title: What a virtual machine is
    beats: 6
    board:
      - box: Virtual machine
        id: vm
        role: problem
        at: 1
        in:
          - box: 'Hypervisor / one real machine, several pretend ones'
            id: hyp
            at: 2
          - box: 'Guest OS / its own kernel, its own drivers'
            id: guest
            at: 3

      - column:
        id: costs
        at: 4
        in:
          - { sym: shield, says: 'Good isolation', role: good, at: 4 }
          - { sym: warehouse, says: 'Heavy — gigabytes on disk', at: 5 }
          - { sym: stopwatch, says: 'About a minute to boot', at: 5 }
          - { sym: server, says: 'A whole OS for every program', at: 6 }

      - column:
        at: 6
        in:
          - arr: ['-', '-', '-', '-', '-', '-', '-']
            id: many
            role: problem
            at: 6
          - { sym: sad face, at: 6 }

  - n: 2
    title: A process wearing a costume
    beats: 6
    board:
      - box: The host machine
        id: host
        role: system
        at: 2
        in:
          - { box: 'One shared kernel', id: kernel, role: system, at: '2*' }

      - { box: 'An ordinary process', id: container, role: package, at: '2*' }
      - shares: [container, kernel]
        says: 'nothing is emulated, nothing is virtualised'
        at: 5

      - group: What the kernel hides from it
        id: hidden
        role: inert
        at: 3
        in:
          - { box: Its own filesystem, at: 4 }
          - { box: Its own network, at: 4 }
          - { box: Its own process table, at: 4 }

      - { sym: processor, at: 2 }
      - { sym: layers, at: 3 }
      - { img: data centre server rack photograph, at: 4 }
      - { callout: 'the kernel is lying to it, consistently', role: package, at: 5 }

  - n: 3
    title: Recipe, image, container
    beats: 6
    board:
      - flow:
        id: build
        layout: horizontal
        role: package
        in:
          - { step: 'Dockerfile / the recipe', at: 2 }
          - { step: 'Image / read-only, frozen', at: 3 }
          - { step: 'Registry / anyone can pull it', at: 4 }
          - { step: 'Container / a running process', at: 5 }

      - code: 'FROM python:3.12 / COPY . /app / RUN pip install -r requirements.txt / CMD ["python", "app.py"]'
        at: '2*'

      - { box: 'The same bytes / on your laptop and in production', id: same, role: package, at: 6 }

      - { sym: wrench, at: 2 }
      - { sym: container, at: 5 }
      - { img: cargo ship loading at port photograph, at: 6 }

  - n: 4
    title: Frozen, and therefore shareable
    beats: 4
    carry: [same]
    board:
      - stk:
        id: layers
        role: package
        at: 2
        rows:
          - { text: 'Your app — one thin writable layer, per container', at: 4 }
          - { text: 'pip packages — read-only, shared', at: 2 }
          - { text: 'python:3.12 — read-only, shared', at: 2 }
          - { text: 'debian base — read-only, shared', at: 2 }

      - { hl: layers.top, at: 4 }
      - { box: 'Ten containers', id: ten, stat: '1 image · 10 thin layers', role: package, at: 3 }

      - { sym: layers, at: 2 }
      - { sym: disk, at: 3 }
      - { img: warehouse shelving stacked high photograph, at: 4 }
      - { callout: 'ten containers do not cost ten copies', role: package, at: 4 }

  - n: 5
    title: The two doors you open yourself
    beats: 4
    carry: [container]
    board:
      - { label: 'Two things it does not keep to itself', at: 1 }

      - { box: 'Volume / host storage, mounted in', id: volume, role: system, at: 2 }
      - { mounts: [volume, container], says: 'data outlives the container', at: 2 }

      - { box: 'Published port', id: port, stat: '8080 → 80', role: system, at: 3 }
      - { maps: [port, container], says: 'one door, opened on purpose', at: 3 }

      - { sym: folder, at: 2 }
      - { sym: cable, at: 3 }
      - { img: ship container with its doors open photograph, at: 3 }
      - { callout: 'everything else is hidden unless you asked for it', role: package, at: 4 }

  - n: 6
    title: Not a small computer
    beats: 4
    carry: [container]
    board:
      - transform: container
        to: 'A process with a restricted view'
        stat: '1 kernel · 1 image · 0 operating systems'
        at: 2

      - group: What is actually going on
        id: truth
        role: system
        at: 3
        in:
          - { box: A restricted view }
          - { box: A frozen image }
          - { box: A shared kernel }

      - { focus: truth, at: 3 }
      - { sym: processor, at: 2 }
      - { sym: scales, at: 3 }
      - { img: single lit window in an office block photograph, at: 4 }
      - { callout: 'everything fast about containers follows from what they do not do', role: package, at: 4 }
